<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DJ YouTube Club</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Strobe/Club Light Screen -->
    <div id="strobe-screen" class="strobe-bg"></div>

    <div class="container">
        <header>
            <h1>🎧 VIRTUAL YOUTUBE DJ MIXER 🎶</h1>
            <p>Mainkan musik dari YouTube langsung tanpa download + Fitur Lampu Disko!</p>
        </header>

        <!-- Club Light Controller -->
        <section class="light-control-panel">
            <h3>🪩 KONTROL LAMPU DISKO LAYAR</h3>
            <div class="light-buttons">
                <button id="btn-light-off" class="btn active">OFF</button>
                <button id="btn-light-strobe" class="btn">STROBE KEDIP</button>
                <button id="btn-light-rainbow" class="btn">RAINBOW FLOW</button>
            </div>
            <p class="hint">*Tips: Fullscreen browser Anda (tekan F11) biar makin mantap efek lampunya!</p>
        </section>

        <!-- DJ Mixer Board -->
        <div class="mixer-board">
            
            <!-- DECK A (Kiri) -->
            <div class="deck" id="deck-a">
                <h2>DECK A</h2>
                <div class="search-box">
                    <input type="text" id="search-a" placeholder="Masukkan URL YouTube / Video ID...">
                    <button id="load-a">LOAD</button>
                </div>
                <!-- YouTube Player Placeholder -->
                <div class="video-container">
                    <div id="player-a"></div>
                </div>
                <div class="audio-controls">
                    <label>Volume A</label>
                    <input type="range" id="vol-a" min="0" max="100" value="50">
                    
                    <label>Bass Boost (EQ)</label>
                    <input type="range" id="bass-a" min="0" max="100" value="50">
                </div>
            </div>

            <!-- CROSSFADER (Tengah) -->
            <div class="crossfader-section">
                <h3>CROSSFADER</h3>
                <input type="range" id="crossfader" min="-50" max="50" value="0">
                <div class="fader-labels">
                    <span>A</span>
                    <span>B</span>
                </div>
            </div>

            <!-- DECK B (Kanan) -->
            <div class="deck" id="deck-b">
                <h2>DECK B</h2>
                <div class="search-box">
                    <input type="text" id="search-b" placeholder="Masukkan URL YouTube / Video ID...">
                    <button id="load-b">LOAD</button>
                </div>
                <!-- YouTube Player Placeholder -->
                <div class="video-container">
                    <div id="player-b"></div>
                </div>
                <div class="audio-controls">
                    <label>Volume B</label>
                    <input type="range" id="vol-b" min="0" max="100" value="50">
                    
                    <label>Bass Boost (EQ)</label>
                    <input type="range" id="bass-b" min="0" max="100" value="50">
                </div>
            </div>

        </div>
    </div>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
  </html>
